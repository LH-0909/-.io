<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WQI 分析 · AquaVision</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <a href="./index.html" class="topbar-brand"><span class="logo-icon">🐟</span>渔瞳 · AquaVision</a>
            <div class="topbar-nav">
                <a href="./index.html">首页</a><a href="./dashboard.html">仪表盘</a><a href="./models.html">模型管理</a><a href="./wqi.html" class="active">WQI分析</a><a href="./alerts.html">告警中心</a><a href="./data.html">数据管理</a>
            </div>
        </div>
        <div class="topbar-right"><button class="topbar-btn" onclick="toggleTheme()">🌓</button></div>
    </div>

    <div class="dashboard">
        <div class="header">
            <div class="header-left"><h1>🧪 WQI 水质指数分析</h1><span class="subtitle">NSF公式计算 · ML预测 · 特征重要性</span></div>
        </div>

        <div class="wqi-page-grid">
            <div class="wqi-input-section">
                <div class="card-header">📝 参数输入</div>
                <div class="wqi-form-grid">
                    <div class="wqi-form-field"><label>pH</label><input type="number" id="wqi-ph" value="7.8" step="0.1"></div>
                    <div class="wqi-form-field"><label>溶解氧 (mg/L)</label><input type="number" id="wqi-do" value="6.5" step="0.1"></div>
                    <div class="wqi-form-field"><label>温度 (℃)</label><input type="number" id="wqi-temp" value="24.0" step="0.1"></div>
                    <div class="wqi-form-field"><label>浊度 (NTU)</label><input type="number" id="wqi-turb" value="8.0" step="0.1"></div>
                    <div class="wqi-form-field"><label>BOD (mg/L)</label><input type="number" id="wqi-bod" value="3.0" step="0.1"></div>
                    <div class="wqi-form-field"><label>COD (mg/L)</label><input type="number" id="wqi-cod" value="15.0" step="0.1"></div>
                    <div class="wqi-form-field"><label>硝酸盐 (mg/L)</label><input type="number" id="wqi-nitrate" value="2.0" step="0.1"></div>
                    <div class="wqi-form-field"><label>磷酸盐 (mg/L)</label><input type="number" id="wqi-phosphate" value="1.0" step="0.1"></div>
                    <div class="wqi-form-field"><label>TDS (mg/L)</label><input type="number" id="wqi-tds" value="200" step="1"></div>
                    <div class="wqi-form-field"><label>粪大肠菌 (CFU/100mL)</label><input type="number" id="wqi-fc" value="30" step="1"></div>
                </div>
                <div class="actions-row" style="margin-top:16px;">
                    <button class="btn-primary" onclick="calculateWQI()">🔬 计算 WQI (公式)</button>
                    <button class="btn-secondary" onclick="predictWQI()">🤖 ML 预测</button>
                    <button class="btn-secondary" onclick="trainWQI()">🧠 训练 WQI 模型</button>
                </div>
            </div>

            <div class="wqi-result-section">
                <div class="card-header">📊 计算结果</div>
                <div class="wqi-compare">
                    <div class="wqi-compare-item"><div class="label">NSF 公式</div><div class="val" id="wqi-formula-result">--</div><div style="font-size:0.8rem;color:var(--text-muted);" id="wqi-formula-grade"></div></div>
                    <div class="wqi-compare-item"><div class="label">ML 预测</div><div class="val" id="wqi-ml-result">--</div><div style="font-size:0.8rem;color:var(--text-muted);" id="wqi-ml-grade"></div></div>
                </div>
                <div id="wqi-radar-result" style="width:100%;height:300px;"></div>
            </div>
        </div>

        <div class="trend-card" style="margin-bottom:18px;">
            <div class="card-header"><span>📈 WQI 特征重要性</span><button class="chip" onclick="loadWQIImportance()">🔄 刷新</button></div>
            <div id="wqi-importance-chart" style="width:100%;height:350px;"></div>
        </div>
    </div>

    <script src="./static/js/mock-api.js"></script>
    <script src="./static/js/charts.js"></script>
    <script src="./static/js/components/toast.js"></script>
    <script src="./static/js/pages/wqi.js"></script>
    <script>
    window.toggleTheme = function() {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? '' : 'dark';
        if (next) document.documentElement.setAttribute('data-theme', next);
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('aquavision-theme', next);
    };
    </script>
</body>
</html>
